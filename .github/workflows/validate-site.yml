name: Validate site code

on:
  push:
    branches: [main]
    paths: ["**.py", "**.js", "**.mjs", "**.css", "**.html", "README.md", ".github/workflows/validate-site.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install pytest requests pyyaml
      - run: python -m pytest -q tests
      - run: node --test tests/test_macro_calendar_frontend.mjs tests/test_x_copy.mjs
      - run: python scripts/update_tech_company_events.py --validate-only
      - run: python scripts/merge_macro_calendars.py --validate-only
