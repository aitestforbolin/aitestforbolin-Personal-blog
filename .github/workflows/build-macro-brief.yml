name: Build pre-release Macro Brief

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-macro-brief.yml"
  schedule:
    # Repeated checks reduce the chance that GitHub's scheduler misses a brief window.
    # Beijing 20:00-20:25 and 21:00-21:25 for 20:30/21:30 releases.
    - cron: "0,5,10,15,20,25 12,13 * * 1-5"
    # Beijing 01:30-01:55 and 02:30-02:55 for 02:00/03:00 FOMC releases.
    - cron: "30,35,40,45,50,55 17,18 * * 1-5"
  workflow_dispatch:
    inputs:
      force_next:
        description: "Build and email the next whitelisted event regardless of time window"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: macro-brief-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh event calendar
        run: |
          python scripts/fetch_forex_factory_calendar.py
          python scripts/merge_macro_calendars.py

      - name: Refresh gold, BTC and DXY
        continue-on-error: true
        run: python scripts/update_market_prices.py

      - name: Enable one-off Jobless Claims test
        shell: bash
        run: |
          if [[ "$(TZ=Asia/Shanghai date +%F)" != "2026-09-17" ]]; then
            echo "One-off Jobless Claims test is inactive outside 2026-09-17 Beijing time."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/build_macro_brief.py")
          text = path.read_text(encoding="utf-8")

          old_event_key = '''def event_key(event: dict) -> str | None:
    legacy = event.get("legacy") if isinstance(event.get("legacy"), dict) else {}
    value = legacy.get("title")
    return value if value in BRIEF_WHITELIST else None
'''
          new_event_key = '''def event_key(event: dict) -> str | None:
    legacy = event.get("legacy") if isinstance(event.get("legacy"), dict) else {}
    value = legacy.get("title")
    if value in BRIEF_WHITELIST:
        return value
    scheduled = event.get("scheduledAt")
    if value == "Jobless Claims" and isinstance(scheduled, str) and scheduled.startswith("2026-09-17T"):
        return value
    return None
'''
          if old_event_key not in text:
              raise SystemExit("Expected event_key implementation not found")
          text = text.replace(old_event_key, new_event_key, 1)

          watch_anchor = '}\n\n\ndef load_json'
          watch_injection = '}\nWATCH_POINTS["Jobless Claims"] = ["初请失业金人数是否明显偏离预期", "就业降温信号是否改变市场对Fed后续利率路径的判断", "美元、短端美债、黄金与BTC是否出现一致的重新定价"]\n\n\ndef load_json'
          if watch_anchor not in text:
              raise SystemExit("Expected WATCH_POINTS insertion point not found")
          text = text.replace(watch_anchor, watch_injection, 1)
          path.write_text(text, encoding="utf-8")
          print("Enabled only the 2026-09-17 Jobless Claims event for this Macro Brief test.")
          PY

      - name: Build eligible Macro Brief
        id: brief
        shell: bash
        run: |
          force_arg=""
          if [[ "${{ inputs.force_next || 'false' }}" == "true" ]]; then
            force_arg="--force-next"
          fi
          trigger_type="${{ github.event_name }}"
          # A run that starts 30-60 minutes early captures the next eligible event,
          # waits only until the 25-minute target, and then re-runs the normal builder.
          # The 0-10 minute range remains an emergency fallback for delayed Actions runs.
          python scripts/build_macro_brief.py \
            --probe --trigger-type "$trigger_type" \
            --min-minutes 0 --max-minutes 30 \
            --capture-minutes 60 --target-minutes 25 --max-wait-seconds 2100 \
            $force_arg | tee /tmp/macro-brief-probe.txt
          action="$(sed -n 's/^action=//p' /tmp/macro-brief-probe.txt | tail -1)"
          wait_seconds="$(sed -n 's/^wait_seconds=//p' /tmp/macro-brief-probe.txt | tail -1)"
          if [[ "$action" == "wait" ]]; then
            echo "Macro Brief capture succeeded; waiting ${wait_seconds}s for the normal generation window."
            sleep "${wait_seconds:-0}"
          fi
          if [[ "$action" == "wait" || "$action" == "generate" ]]; then
            python scripts/build_macro_brief.py \
              --trigger-type "$trigger_type" \
              --min-minutes 0 --max-minutes 30 \
              --capture-minutes 60 --target-minutes 25 --max-wait-seconds 2100 \
              $force_arg | tee /tmp/macro-brief-result.txt
          else
            cp /tmp/macro-brief-probe.txt /tmp/macro-brief-result.txt
          fi
          generated="$(sed -n 's/^generated=//p' /tmp/macro-brief-result.txt | tail -1)"
          echo "generated=${generated:-false}" >> "$GITHUB_OUTPUT"

      - name: Validate Macro Brief code
        run: |
          python -m py_compile scripts/build_macro_brief.py scripts/send_macro_brief_email.py
          python -m unittest tests/test_macro_brief.py -v

      - name: Commit generated Brief
        id: commit
        if: steps.brief.outputs.generated == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/macro-brief.json data/macro-brief-state.json data/macro-calendar.json data/us-macro-calendar.json data/market-prices.json
          git commit -m "Build pre-release Macro Brief"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          exit 1

      - name: Email Macro Brief through iCloud Mail
        if: steps.brief.outputs.generated == 'true' && steps.commit.outcome == 'success'
        env:
          ICLOUD_SMTP_USER: ${{ secrets.ICLOUD_SMTP_USER }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          EMAIL_NOTIFY_TO: ${{ secrets.EMAIL_NOTIFY_TO }}
        run: |
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python scripts/send_macro_brief_email.py --run-url "$run_url"
