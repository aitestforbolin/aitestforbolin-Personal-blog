name: Update market prices

on:
  schedule:
    # Avoid GitHub's busiest top/bottom-of-hour cron window. During both EDT and
    # EST this creates two samples inside the 60 minutes before the 16:00 ET close.
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-prices-writer
  cancel-in-progress: false

jobs:
  update-market-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest market prices
        run: python scripts/update_market_prices.py
      - name: Commit market price data
        run: |
          if git diff --quiet -- data/market-prices.json; then
            echo "No market price changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-prices.json
          git commit -m "Update market price data"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort
            fi
            echo "Push attempt $attempt failed; retrying."
            sleep $((attempt * 5))
          done

          echo "Could not push market price data after 3 attempts."
          exit 1
