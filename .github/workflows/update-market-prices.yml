name: Update market prices

on:
  schedule:
    # Six close-window samples cover both EDT (20:00 UTC close) and EST
    # (21:00 UTC close) without rewriting main around the clock.
    - cron: "11,41 19-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-prices-writer
  cancel-in-progress: false

jobs:
  update-market-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh and commit market price data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git switch --detach origin/main
            python scripts/update_market_prices.py

            if git diff --quiet -- data/market-prices.json; then
              echo "No market price changes."
              exit 0
            fi

            git add data/market-prices.json
            git commit -m "Update market price data"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; refreshing from the latest main."
            sleep $((attempt * 5))
          done

          echo "Could not push market price data after 3 attempts."
          exit 1
