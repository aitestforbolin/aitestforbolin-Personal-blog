name: Collect and publish country news titles

on:
  schedule:
    # 07:30 Asia/Shanghai and every two hours thereafter.
    - cron: "30 1-23/2 * * *"
  workflow_dispatch:
    inputs:
      publish_snapshot:
        description: "Also publish the latest fixed 24-hour snapshot"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: repository-data-writer
  cancel-in-progress: false

jobs:
  collect-country-news:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Restore the rolling 48-hour store
        run: |
          git fetch origin country-news-data || true
          if git show-ref --verify --quiet refs/remotes/origin/country-news-data; then
            git show origin/country-news-data:data/life-society-news-store.json > /tmp/life-society-news-store.json
          else
            echo '{"schemaVersion":2,"items":[]}' > /tmp/life-society-news-store.json
          fi
      - name: Collect feeds and publish any missing 07:30 snapshot
        id: collect
        env:
          MANUAL_SNAPSHOT: ${{ inputs.publish_snapshot }}
        run: |
          args=(--store-file /tmp/life-society-news-store.json --snapshot-file data/life-society-news.json --snapshot-if-due)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$MANUAL_SNAPSHOT" == "true" ]]; then
            args+=(--snapshot)
          fi
          result="$(python scripts/fetch_life_society_news.py "${args[@]}")"
          echo "$result"
          publish="$(python -c 'import json, sys; print(str(json.loads(sys.argv[1])["snapshot"]).lower())' "$result")"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Save rolling store on the data branch
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/country-news-data; then
            git worktree add -B country-news-data /tmp/country-news-data origin/country-news-data
          else
            git worktree add -b country-news-data /tmp/country-news-data HEAD
          fi
          mkdir -p /tmp/country-news-data/data
          cp /tmp/life-society-news-store.json /tmp/country-news-data/data/life-society-news-store.json
          cd /tmp/country-news-data
          if git diff --quiet -- data/life-society-news-store.json; then exit 0; fi
          git add -- data/life-society-news-store.json
          git commit -m "Collect country news titles"
          git push origin HEAD:country-news-data
      - name: Publish the fixed 24-hour snapshot
        if: steps.collect.outputs.publish == 'true'
        run: |
          if git diff --quiet -- data/life-society-news.json; then exit 0; fi
          git add -- data/life-society-news.json
          git commit -m "Publish 07:30 country news snapshot"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          exit 1
