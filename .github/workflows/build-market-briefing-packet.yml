name: Build market briefing packet

on:
  schedule:
    # 06:30 Asia/Shanghai, Tuesday-Saturday; 90-150 minutes after the U.S. close.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-data-writer
  cancel-in-progress: false

jobs:
  build-market-briefing-packet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Switch to the packet data branch
        run: |
          git fetch origin market-briefing-data || true
          if git show-ref --verify --quiet refs/remotes/origin/market-briefing-data; then
            git switch -C market-briefing-data origin/market-briefing-data
            git merge --no-edit origin/main
          else
            git switch -c market-briefing-data
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate packet
        run: python scripts/build_market_briefing_packet.py
      - name: Commit packet
        run: |
          if git diff --quiet -- data/market-briefing-packet.json; then
            echo "Market briefing packet is already current."
            exit 0
          fi
          git add data/market-briefing-packet.json
          git commit -m "Build market briefing packet"
          for attempt in 1 2 3; do
            if git push origin HEAD:market-briefing-data; then
              exit 0
            fi
            git fetch origin market-briefing-data
            git rebase origin/market-briefing-data || exit 1
            sleep $((attempt * 5))
          done
          exit 1
