name: Build market briefing packet

on:
  workflow_run:
    workflows:
      - Update market prices
    types:
      - completed
  schedule:
    # 06:35 Asia/Shanghai fallback. The close-ready workflow_run is primary.
    - cron: "35 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-briefing-packet
  cancel-in-progress: false

jobs:
  build-market-briefing-packet:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Load the previous canonical packet
        run: |
          git fetch origin market-briefing-data || true
          if git show-ref --verify --quiet refs/remotes/origin/market-briefing-data; then
            git show origin/market-briefing-data:data/market-briefing-packet.json \
              > /tmp/previous-market-briefing-packet.json || true
          fi
      - name: Check completed close snapshot
        id: packet_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREVIOUS_PACKET_PATH: /tmp/previous-market-briefing-packet.json
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] \
            || [ "$EVENT_NAME" = "schedule" ] \
            || python scripts/market_packet_trigger.py; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure Git identity
        if: steps.packet_gate.outputs.build == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        if: steps.packet_gate.outputs.build == 'true'
        with:
          python-version: "3.12"
      - name: Test packet builder
        if: steps.packet_gate.outputs.build == 'true'
        run: |
          python -m unittest tests/test_market_briefing_packet.py -v
          python -m unittest tests/test_market_packet_trigger.py -v
      - name: Build packet
        id: packet_build
        if: steps.packet_gate.outputs.build == 'true'
        continue-on-error: true
        env:
          PREVIOUS_PACKET_PATH: /tmp/previous-market-briefing-packet.json
        run: |
          python scripts/build_market_briefing_packet.py
      - name: Commit packet
        if: steps.packet_gate.outputs.build == 'true' && steps.packet_build.outcome != 'skipped'
        run: |
          packet_file="$GITHUB_WORKSPACE/data/market-briefing-packet.json"
          packet_worktree="$(mktemp -d)"
          git fetch origin market-briefing-data || true
          if git show-ref --verify --quiet refs/remotes/origin/market-briefing-data; then
            git worktree add --detach "$packet_worktree" origin/market-briefing-data
          else
            git worktree add --detach "$packet_worktree" HEAD
          fi
          cd "$packet_worktree"
          git switch -C market-briefing-data
          mkdir -p data
          cp "$packet_file" data/market-briefing-packet.json
          if git diff --quiet -- data/market-briefing-packet.json; then
            echo "Market briefing packet is already current."
            exit 0
          fi
          git add data/market-briefing-packet.json
          git commit -m "Build market briefing packet"
          git push origin HEAD:market-briefing-data
      - name: Enforce packet validation result
        if: steps.packet_gate.outputs.build == 'true' && steps.packet_build.outcome == 'failure'
        run: |
          echo "The latest packet attempt was committed with validation.complete=false."
          exit 1
