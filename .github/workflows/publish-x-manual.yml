name: Finalize daily market briefing

on:
  push:
    branches:
      - main
    paths:
      - data/daily-market-status.json
      - data/run-status.json
  schedule:
    # 07:30 Asia/Shanghai watchdog, Tuesday-Saturday.
    - cron: "30 23 * * 1-5"
  workflow_dispatch:
    inputs:
      as_of:
        description: "Expected daily briefing asOf (YYYY-MM-DD); blank uses the current snapshot"
        required: false
        type: string
      dry_run:
        description: "Render and validate only; do not publish"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: x-daily-market-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect briefing snapshot change
        id: gate
        run: |
          briefing_commit="$(git log -1 --format=%H -- data/daily-market-status.json)"
          echo "briefing_commit=$briefing_commit" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "record=false" >> "$GITHUB_OUTPUT"
            else
              echo "record=true" >> "$GITHUB_OUTPUT"
            fi
          elif git diff-tree --root --no-commit-id --name-only -r "$GITHUB_SHA" \
            | rg -x 'data/daily-market-status\.json' >/dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "record=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "record=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate X publication data completeness
        id: validate
        if: steps.gate.outputs.publish == 'true'
        run: |
          python -m unittest tests.test_validate_x_snapshot -v
          python scripts/validate_x_snapshot.py --snapshot data/daily-market-status.json
      - name: Render, deduplicate, and publish
        id: publish
        if: steps.gate.outputs.publish == 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_EXPECTED_USERNAME: whybolin
          BRIEFING_SOURCE_COMMIT: ${{ steps.gate.outputs.briefing_commit }}
          PUBLISH_MODE: ${{ github.event_name == 'push' && 'automatic' || 'manual' }}
          INPUT_AS_OF: ${{ inputs.as_of }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--mode "$PUBLISH_MODE")
          if [[ -n "$INPUT_AS_OF" ]]; then
            args+=(--as-of "$INPUT_AS_OF")
          fi
          if [[ "$INPUT_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python scripts/publish_x_post.py "${args[@]}"
      - name: Finalize canonical run status
        id: finalize
        if: >-
          always() && steps.gate.outputs.record == 'true'
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PUBLISH_STATUS: ${{ steps.publish.outputs.status }}
        run: |
          python scripts/finalize_run_status.py \
            --from-x \
            --validate-outcome "$VALIDATE_OUTCOME" \
            --publish-outcome "$PUBLISH_OUTCOME" \
            --publish-status "$PUBLISH_STATUS" \
            --briefing-commit "${{ steps.gate.outputs.briefing_commit }}"
      - name: Record X ledger and canonical run status
        id: record
        if: >-
          always() && steps.gate.outputs.record == 'true' &&
          steps.finalize.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/x-publish-log.json data/run-status.json
          if git diff --cached --quiet; then
            echo "Run status and X ledger are already current."
            exit 0
          fi
          git commit -m "Finalize market briefing run for ${{ steps.finalize.outputs.as_of }}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done
          exit 1
      - name: Mark local status when its commit failed
        if: >-
          always() && steps.gate.outputs.record == 'true' &&
          steps.record.outcome == 'failure'
        run: |
          python scripts/finalize_run_status.py \
            --status failed \
            --stage commit \
            --as-of "${{ steps.finalize.outputs.as_of }}" \
            --reason-code run_status_commit_failed
      - name: Notify final daily briefing status by Gmail
        id: notify
        if: >-
          always() && steps.gate.outputs.record == 'true' &&
          steps.finalize.outcome == 'success'
        env:
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_NOTIFY_TO: ${{ secrets.GMAIL_NOTIFY_TO }}
        run: |
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python scripts/send_gmail_notification.py \
            --run-url "$run_url"
      - name: Preserve failed workflow conclusion
        if: >-
          always() && steps.gate.outputs.record == 'true' &&
          (steps.finalize.outputs.status == 'failed' ||
           steps.record.outcome == 'failure' ||
           steps.notify.outcome == 'failure')
        run: exit 1

  notify-early-status:
    if: >-
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'Finalize early market briefing status')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Notify from canonical run status
        env:
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_NOTIFY_TO: ${{ secrets.GMAIL_NOTIFY_TO }}
        run: |
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python scripts/send_gmail_notification.py --run-url "$run_url"

  watchdog:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check today's terminal status
        id: watchdog
        run: python scripts/watch_market_briefing_run.py
      - name: Commit missing-status failure
        if: steps.watchdog.outputs.action == 'created_failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/run-status.json
          git commit -m "Record missing daily market briefing status"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done
          exit 1
      - name: Notify missing-status failure
        if: >-
          steps.watchdog.outputs.action == 'created_failure' ||
          steps.watchdog.outputs.action == 'notify_existing_failure'
        env:
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_NOTIFY_TO: ${{ secrets.GMAIL_NOTIFY_TO }}
        run: |
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python scripts/send_gmail_notification.py --run-url "$run_url"
