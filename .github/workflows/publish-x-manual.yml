name: Publish daily market briefing to X

on:
  push:
    branches:
      - main
    paths:
      - data/daily-market-status.json
  workflow_dispatch:
    inputs:
      as_of:
        description: "Expected daily briefing asOf (YYYY-MM-DD); blank uses the current snapshot"
        required: false
        type: string
      dry_run:
        description: "Render and validate only; do not publish"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: x-daily-market-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate X publication data completeness
        id: validate
        run: |
          python -m unittest tests.test_validate_x_snapshot -v
          python scripts/validate_x_snapshot.py --snapshot data/daily-market-status.json
      - name: Render, deduplicate, and publish
        id: publish
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_EXPECTED_USERNAME: whybolin
          PUBLISH_MODE: ${{ github.event_name == 'push' && 'automatic' || 'manual' }}
          INPUT_AS_OF: ${{ inputs.as_of }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--mode "$PUBLISH_MODE")
          if [[ -n "$INPUT_AS_OF" ]]; then
            args+=(--as-of "$INPUT_AS_OF")
          fi
          if [[ "$INPUT_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python scripts/publish_x_post.py "${args[@]}"
      - name: Record successful Post ID
        id: record
        if: steps.publish.outputs.status == 'published'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/x-publish-log.json
          git commit -m "Record X Post for ${{ steps.publish.outputs.as_of }}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done
          exit 1
      - name: Notify final daily briefing status by Gmail
        if: always() && github.event_name == 'push'
        continue-on-error: true
        env:
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_NOTIFY_TO: ${{ secrets.GMAIL_NOTIFY_TO }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PUBLISH_STATUS: ${{ steps.publish.outputs.status }}
          RECORD_OUTCOME: ${{ steps.record.outcome }}
          AS_OF: ${{ steps.publish.outputs.as_of }}
          POST_URL: ${{ steps.publish.outputs.post_url }}
          POST_ID: ${{ steps.publish.outputs.post_id }}
        run: |
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [[ "$VALIDATE_OUTCOME" == "success" \
                && "$PUBLISH_OUTCOME" == "success" \
                && "$PUBLISH_STATUS" == "published" \
                && "$RECORD_OUTCOME" == "success" ]]; then
            python scripts/send_gmail_notification.py \
              --status success \
              --as-of "$AS_OF" \
              --post-url "$POST_URL" \
              --post-id "$POST_ID" \
              --run-url "$run_url"
            exit 0
          fi

          reason="validation=$VALIDATE_OUTCOME; publish=$PUBLISH_OUTCOME/$PUBLISH_STATUS; record=$RECORD_OUTCOME"
          python scripts/send_gmail_notification.py \
            --status failure \
            --as-of "$AS_OF" \
            --post-url "$POST_URL" \
            --post-id "$POST_ID" \
            --reason "$reason" \
            --run-url "$run_url"
