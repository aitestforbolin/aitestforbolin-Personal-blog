name: Update crypto fundraising

on:
  schedule:
    # GitHub Actions cron uses UTC. Run Tue-Sat at 08:30 / 10:30 Asia/Shanghai.
    - cron: "30 0 * * 2-6"
    - cron: "30 2 * * 2-6"
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-crypto-fundraising.yml
      - scripts/update_crypto_fundraising.py
      - scripts/update_crypto_fundraising_resilient.py
      - tests/test_crypto_fundraising.py
      - tests/test_crypto_fundraising_resilient.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-fundraising-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-crypto-fundraising:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh latest fundraising projects
        run: |
          for attempt in 1 2; do
            set +e
            python scripts/update_crypto_fundraising_resilient.py
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if [ "$status" -eq 75 ]; then
              echo "::warning::Both official website routes require browser verification. The independent 10:40 Work fallback will refresh the data."
              exit 0
            fi

            if [ "$attempt" -lt 2 ]; then
              echo "Fundraising refresh failed on both official routes; retrying in 20 seconds."
              sleep 20
            fi
          done

          echo "::error::Fundraising refresh failed unexpectedly on both public routes; the previously published data was preserved."
          exit 1

      - name: Validate fundraising parser and data
        run: |
          python -m py_compile scripts/update_crypto_fundraising.py scripts/update_crypto_fundraising_resilient.py
          python -m unittest tests.test_crypto_fundraising tests.test_crypto_fundraising_resilient

      - name: Commit updated fundraising data
        run: |
          if git diff --quiet -- data/crypto-fundraising.json; then
            echo "Crypto fundraising data is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crypto-fundraising.json
          git commit -m "Update crypto fundraising data"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort
            fi
            echo "Push attempt $attempt failed; retrying."
            sleep $((attempt * 5))
          done

          echo "Could not push crypto fundraising data after 3 attempts."
          exit 1
