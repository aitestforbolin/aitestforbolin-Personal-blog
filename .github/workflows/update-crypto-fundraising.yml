name: Update crypto fundraising

on:
  push:
    branches:
      - main
    paths:
      - data/crypto-fundraising-trigger.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-fundraising-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-crypto-fundraising:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh latest fundraising projects from bridge
        run: |
          for attempt in 1 2; do
            if python scripts/update_crypto_fundraising.py; then
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              echo "Fundraising bridge returned no valid five-item payload; retrying in 20 seconds."
              sleep 20
            fi
          done
          echo "::error::Fundraising bridge failed validation; the previously published data was preserved."
          exit 1

      - name: Validate fundraising data contract
        run: |
          python -m py_compile scripts/update_crypto_fundraising.py
          python -m unittest tests.test_crypto_fundraising

      - name: Record refresh completion
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          trigger_path = Path("data/crypto-fundraising-trigger.json")
          trigger = {}
          if trigger_path.exists():
              try:
                  trigger = json.loads(trigger_path.read_text(encoding="utf-8"))
              except Exception:
                  trigger = {}

          if os.environ.get("GITHUB_EVENT_NAME") == "push":
              request_id = str(trigger.get("requestId") or "")
              requested_at = trigger.get("requestedAt")
          else:
              request_id = "manual-" + os.environ["GITHUB_RUN_ID"]
              requested_at = None

          if not request_id:
              raise RuntimeError("Missing requestId in crypto-fundraising-trigger.json")

          status = {
              "schemaVersion": 1,
              "status": "success",
              "requestId": request_id,
              "requestedAt": requested_at,
              "completedAt": datetime.now(timezone.utc).isoformat(),
              "githubRunId": int(os.environ["GITHUB_RUN_ID"]),
          }
          Path("data/crypto-fundraising-refresh-status.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(status, ensure_ascii=False))
          PY

      - name: Commit updated fundraising data and refresh receipt
        run: |
          if git diff --quiet -- data/crypto-fundraising.json data/crypto-fundraising-history.json data/crypto-fundraising-refresh-status.json; then
            echo "Crypto fundraising data and refresh receipt are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crypto-fundraising.json data/crypto-fundraising-history.json data/crypto-fundraising-refresh-status.json
          git commit -m "Update crypto fundraising data"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo "::error::Could not push crypto fundraising data after 3 attempts."
          exit 1
