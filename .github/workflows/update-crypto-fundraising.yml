name: Update crypto fundraising

on:
  push:
    branches:
      - main
    paths:
      - data/crypto-fundraising-trigger.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-fundraising-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-crypto-fundraising:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh latest fundraising projects from bridge
        id: collect
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2; do
            if python scripts/update_crypto_fundraising.py; then
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              echo "Fundraising bridge returned no valid five-item payload; retrying in 20 seconds."
              sleep 20
            fi
          done
          echo "::error::Fundraising bridge failed validation; the previously published data was preserved."
          exit 1

      - name: Validate fundraising data contract
        id: validate
        continue-on-error: true
        if: steps.collect.outcome == 'success'
        run: |
          python -m py_compile scripts/execution_receipt.py scripts/update_crypto_fundraising.py
          python -m unittest tests.test_crypto_fundraising

      - name: Record validation failure
        if: steps.validate.outcome == 'failure'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.execution_receipt import set_validation, utc_now, validate_receipt, write_json_atomic
          path = Path("data/crypto-fundraising-refresh-status.json")
          receipt = json.loads(path.read_text(encoding="utf-8"))
          set_validation(receipt, "failed", completed_at=utc_now(), reason="workflow contract validation failed")
          validate_receipt(receipt)
          write_json_atomic(path, receipt)
          PY

      - name: Commit updated fundraising data and refresh receipt
        if: always() && steps.collect.outcome != 'cancelled'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crypto-fundraising-refresh-status.json
          if [ "${{ steps.collect.outcome }}" = "success" ] && [ "${{ steps.validate.outcome }}" = "success" ]; then
            git add data/crypto-fundraising.json data/crypto-fundraising-history.json
          fi
          if git diff --cached --quiet; then
            echo "Crypto fundraising data and refresh receipt are already current."
            exit 0
          fi
          git commit -m "Update crypto fundraising data"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo "::error::Could not push crypto fundraising data after 3 attempts."
          exit 1

      - name: Fail workflow when collection failed
        if: always() && (steps.collect.outcome != 'success' || steps.validate.outcome != 'success')
        run: |
          echo "::error::Crypto fundraising collection or validation failed; failure receipt was preserved."
          exit 1
