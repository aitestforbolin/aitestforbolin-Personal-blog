name: Update crypto fundraising

on:
  schedule:
    # GitHub Actions cron uses UTC. Run daily at 08:30 / 10:30 / 13:30 UTC+8.
    - cron: "30 0 * * *"
    - cron: "30 2 * * *"
    - cron: "30 5 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-crypto-fundraising.yml
      - scripts/update_crypto_fundraising.py
      - tests/test_crypto_fundraising.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-fundraising-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-crypto-fundraising:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh latest fundraising projects from bridge
        run: |
          for attempt in 1 2; do
            if python scripts/update_crypto_fundraising.py; then
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              echo "Fundraising bridge returned no valid five-item payload; retrying in 20 seconds."
              sleep 20
            fi
          done
          echo "::error::Fundraising bridge failed validation; the previously published data was preserved."
          exit 1

      - name: Validate fundraising data contract
        run: |
          python -m py_compile scripts/update_crypto_fundraising.py
          python -m unittest tests.test_crypto_fundraising

      - name: Commit updated fundraising data
        run: |
          if git diff --quiet -- data/crypto-fundraising.json data/crypto-fundraising-history.json; then
            echo "Crypto fundraising data and history are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crypto-fundraising.json data/crypto-fundraising-history.json
          git commit -m "Update crypto fundraising data"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo "Could not push crypto fundraising data after 3 attempts."
          exit 1
