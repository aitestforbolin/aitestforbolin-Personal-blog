name: Update U.S. macro calendar

on:
  push:
    branches:
      - main
    paths:
      - "scripts/fetch_forex_factory_calendar.py"
      - "scripts/validate_us_calendar_shadow.py"
      - "scripts/merge_macro_calendars.py"
      - ".github/workflows/update-us-macro-calendar.yml"
  schedule:
    # Normal calendar refreshes: 05:30, 19:30 and 21:00 Asia/Shanghai.
    - cron: "30 21 * * *"
    - cron: "30 11 * * *"
    - cron: "0 13 * * *"
    # Actual backfill at +3/+8/+15 minutes around common U.S. release windows.
    # 20:30/21:30, 22:00/23:00 and 02:00/03:00 Beijing (DST/standard time).
    - cron: "33,38,45 12,13 * * 1-5"
    - cron: "3,8,15 14,15 * * 1-5"
    - cron: "3,8,15 18,19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-calendar-writer
  cancel-in-progress: false
  queue: max

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh production calendar from Forex Factory
        run: python scripts/fetch_forex_factory_calendar.py --backfill-actual

      - name: Validate FOMC and publish U.S.-only calendar
        run: python scripts/merge_macro_calendars.py

      - name: Update U.S. macro dashboard from released Forex Factory values
        run: python scripts/update_us_macro_dashboard.py --calendar data/us-macro-calendar.json

      - name: Run legacy calendar as a non-blocking shadow check
        id: shadow
        continue-on-error: true
        run: |
          timeout 120s python scripts/update_us_macro_calendar.py --output /tmp/old-us-calendar.json
          python scripts/validate_us_calendar_shadow.py \
            --production data/us-macro-calendar.json \
            --legacy /tmp/old-us-calendar.json

      - name: Validate calendar data and updater behavior
        run: |
          python -m py_compile scripts/fetch_forex_factory_calendar.py scripts/validate_us_calendar_shadow.py scripts/update_us_macro_calendar.py scripts/update_us_macro_dashboard.py scripts/merge_macro_calendars.py
          python -m unittest discover -s tests -p 'test_forex_factory_calendar.py' -v
          python -m unittest discover -s tests -p 'test_us_macro_dashboard.py' -v
          python -m unittest discover -s tests -p 'test_macro_calendar_merge.py' -v
          node --test tests/test_macro_calendar_frontend.mjs
          python scripts/merge_macro_calendars.py --validate-only

      - name: Commit updated calendar
        run: |
          if git diff --quiet -- data/us-macro-calendar.json data/macro-calendar.json data/us-macro-dashboard.json data/us-macro-history.json; then
            echo "Calendar data is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us-macro-calendar.json data/macro-calendar.json data/us-macro-dashboard.json data/us-macro-history.json
          git commit -m "Update US macro calendar"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            echo "Calendar push raced with another data writer; retrying (${attempt}/3)."
            sleep $((attempt * 5))
          done

          echo "Unable to push US macro calendar after three attempts."
          exit 1
