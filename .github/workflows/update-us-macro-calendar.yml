name: Update US macro calendar

on:
  push:
    branches:
      - main
    paths:
      - "scripts/repair_us_macro_calendar.py"
      - "tests/test_us_macro_calendar_repair.py"
      - ".github/workflows/update-us-macro-calendar.yml"
  schedule:
    # 05:35 and 23:10 Asia/Shanghai every day; the morning run feeds the 07:00 briefing.
    - cron: "35 21 * * *"
    - cron: "10 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-calendar-writer
  cancel-in-progress: false
  queue: max

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh calendar data
        run: python scripts/update_us_macro_calendar.py

      - name: Repair missing core BLS releases
        run: python scripts/repair_us_macro_calendar.py

      - name: Rebuild unified China-US calendar
        run: python scripts/merge_macro_calendars.py

      - name: Persist newly released core macro data
        run: python scripts/update_us_macro_dashboard.py

      - name: Validate calendar data and updater behavior
        run: |
          python -m py_compile scripts/update_us_macro_calendar.py scripts/repair_us_macro_calendar.py scripts/update_us_macro_dashboard.py scripts/merge_macro_calendars.py
          python -m unittest discover -s tests -p 'test_us_macro_calendar.py' -v
          python -m unittest discover -s tests -p 'test_us_macro_calendar_repair.py' -v
          python -m unittest discover -s tests -p 'test_us_macro_dashboard.py' -v
          python -m unittest discover -s tests -p 'test_macro_calendar_merge.py' -v
          python scripts/merge_macro_calendars.py --validate-only

      - name: Commit updated calendar
        run: |
          if git diff --quiet -- data/us-macro-calendar.json data/macro-calendar.json data/us-macro-dashboard.json data/us-macro-history.json; then
            echo "Calendar data is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us-macro-calendar.json data/macro-calendar.json data/us-macro-dashboard.json data/us-macro-history.json
          git commit -m "Update US macro calendar"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            echo "Calendar push raced with another data writer; retrying (${attempt}/3)."
            sleep $((attempt * 5))
          done

          echo "Unable to push US macro calendar after three attempts."
          exit 1
