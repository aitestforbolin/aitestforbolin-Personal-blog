name: Update US macro calendar

on:
  schedule:
    # 08:10 and 23:10 Asia/Shanghai every day.
    - cron: "10 0,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-data-writer
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh calendar data
        run: python scripts/update_us_macro_calendar.py

      - name: Rebuild unified China-US calendar
        run: python scripts/merge_macro_calendars.py

      - name: Validate calendar data and updater behavior
        run: |
          python -m unittest discover -s tests -p 'test_us_macro_calendar.py' -v
          python -m unittest discover -s tests -p 'test_macro_calendar_merge.py' -v
          python scripts/merge_macro_calendars.py --validate-only

      - name: Commit updated calendar
        run: |
          if git diff --quiet -- data/us-macro-calendar.json data/macro-calendar.json; then
            echo "Calendar data is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us-macro-calendar.json data/macro-calendar.json
          git commit -m "Update US macro calendar"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            echo "Calendar push raced with another data writer; retrying (${attempt}/3)."
            sleep $((attempt * 5))
          done

          echo "Unable to push US macro calendar after three attempts."
          exit 1
