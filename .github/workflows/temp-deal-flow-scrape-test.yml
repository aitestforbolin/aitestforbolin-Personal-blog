name: Temporary Deal Flow scrape test
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-deal-flow-scrape-test.yml
permissions:
  contents: read
jobs:
  scrape-test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch Deal Flow page and parse ten rows
        run: |
          python - <<'PY'
          from scripts import crypto_fundraising_direct as parser

          parser.SOURCE_URL = "https://crypto-fundraising.info/deal-flow/"
          parser.PROJECT_LIMIT = 10
          payload = parser.fetch_direct_source_payload(timeout=30, retries=2)
          projects = payload["projects"]
          if len(projects) != 10:
              raise SystemExit(f"Expected 10 projects, got {len(projects)}")
          for item in projects:
              print(
                  f'{item["source_rank"]}\t{item["name"]}\t{item["round"] or "Unknown"}\t'
                  f'{item["announced_month"]}\t{item["amount_usd"]}\t{item["detail_url"]}'
              )
          PY
